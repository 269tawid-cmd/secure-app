<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Access | Login</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="login.css">
</head>
<body class="auth-page">

<div style="position: absolute; top: 1rem; right: 1rem;">
  <div class="lang-switcher-wrapper">
    <select id="lang-switcher" class="lang-select">
      <option value="en">EN</option>
      <option value="bn">BN</option>
      <option value="ar">AR</option>
    </select>
  </div>
</div>

<div class="login-box card reveal">
  <div class="text-center mb-12">
    <h2 data-i18n="welcome_back">Welcome Back</h2>
    <p style="color: var(--text-secondary); font-size: 0.875rem;" data-i18n="enter_credentials">Please enter your credentials</p>
  </div>

  <div class="input-group">
    <label for="username" data-i18n="username">Username</label>
    <input type="text" id="username" placeholder="e.g. tawhid_admin" data-i18n-placeholder="username" required>
  </div>

  <div class="input-group" style="position: relative;">
    <label for="password" data-i18n="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" data-i18n-placeholder="password" required>
    <span class="toggle" onclick="togglePassword()" style="position: absolute; right: 1rem; top: 2.5rem; cursor: pointer; opacity: 0.5;">👁</span>
  </div>

  <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;" onclick="login()" data-i18n="sign_in">Sign In</button>

  <div class="text-center mt-12">
    <p style="font-size: 0.875rem; color: var(--text-secondary);">
      <span data-i18n="no_account">Don't have an account?</span> <a href="register.html" style="color: var(--accent-color); text-decoration: none; font-weight: 500;" data-i18n="create_one">Create one</a>
    </p>
  </div>
</div>

<script src="languages.js"></script>
<script src="i18n.js"></script>
<script src="login.js"></script>
</body>
</html>
