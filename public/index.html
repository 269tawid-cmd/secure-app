<!doctype html>
<html>
  <head>
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="dark">
    <div class="floating-grades">
      <span>A+</span><span>A</span><span>B</span><span>F</span> <span>A+</span
      ><span>B</span><span>A</span><span>A+</span> <span>B</span><span>A</span
      ><span>F</span><span>A+</span>
    </div>

    <div class="center-box">
      <div class="login-card">
        <h2>Login</h2>

        <div class="input-group">
          <input id="username" placeholder="Username" />
          <input id="password" type="password" placeholder="Password" />
          <span class="toggle-pass" onclick="togglePassword()">👁</span>
        </div>

        <button onclick="login()">Login</button>

        <p>
          Don't have an account?
          <a href="register.html">Register here</a>
        </p>
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
