<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Secure Access</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-page">

<header class="header">
  <div class="wrap">
    <div class="brand">
      <div style="background: var(--accent-color); padding: 8px; border-radius: 8px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h1>Secure Admin</h1>
    </div>
    <div class="actions" style="display: flex; gap: 1rem;">
      <button class="btn btn-ghost" onclick="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </div>
</header>

<main class="container">
  <div class="card mb-12">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <h2 style="margin: 0;">Student Management</h2>
      <p style="color: var(--text-secondary); font-size: 0.875rem;">Manage academic records</p>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem;" class="form-grid">
      <div class="input-group">
        <label>Student ID</label>
        <input id="id" placeholder="e.g. STU001">
      </div>
      <div class="input-group">
        <label>Full Name</label>
        <input id="name" placeholder="e.g. Tawhid Chowdhury">
      </div>
    </div>

    <div id="subjects-box" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem;"></div>

    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
      <button onclick="addSubject()" class="btn btn-ghost">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Subject
      </button>
      <button class="btn btn-primary" onclick="addStudent()">Save Student</button>
    </div>
  </div>

  <div class="card">
    <h2 style="margin-bottom: 1.5rem;">Student Records</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Subjects</th>
            <th>Total</th>
            <th>Grade</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="table">
          <!-- Dynamic Content -->
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="admin.js"></script>
</body>
</html>
