<!doctype html>
<html>
<head>
  <title>Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

  <div class="floating-grades">
  <span>A+</span><span>A</span><span>B</span><span>F</span>
  <span>A+</span><span>B</span><span>A</span><span>A+</span>
  <span>B</span><span>A</span><span>F</span><span>A+</span>
</div>

<div class="header">
  <div class="wrap">
    <div class="brand">
      <img src="logo.png">
      <h1>Admin Panel</h1>
    </div>
    <div class="actions">
      <button class="btn ghost" onclick="toggleTheme()">Theme</button>
      <button class="btn danger" onclick="logout()">Logout</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="card">
    <h2>Add / Edit Student</h2>

    <div class="form-grid">
      <input id="id" placeholder="ID">
      <input id="name" placeholder="Name">
    </div>

    <div id="subjects-box" class="form-grid"></div>

<button onclick="addSubject()" class="btn">+ Add Subject</button>

    <div id="subjects-box" class="form-grid mt-12"></div>

    <div class="mt-12">
      <button class="btn" onclick="addStudent()">Add</button>
      <button class="btn" onclick="updateStudent()">Update</button>
    </div>
  </div>

  <div class="table-wrap card">
    <table>
      <thead id="thead"></thead>
      <tbody id="table"></tbody>
    </table>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
