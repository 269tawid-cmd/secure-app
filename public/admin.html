<!DOCTYPE html>
<html>
<head>
  <title>Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Admin Dashboard</h2>

<button onclick="logout()">Logout</button>

<div class="form-box">
  <input id="id" placeholder="ID">
  <input id="name" placeholder="Name">
  <input id="math" placeholder="Math">
  <input id="eng" placeholder="English">
  <input id="sci" placeholder="Science">
  <input id="prog" placeholder="Programming">

  <button onclick="addStudent()">Add Student</button>
  <button onclick="updateStudent()">Update Student</button>
</div>
<input id="search" placeholder="Search by name..." onkeyup="searchStudent()">

<table>
<thead>
<tr>
  <th>ID</th>
  <th>Name</th>
  <th>Math</th>
  <th>Eng</th>
  <th>Sci</th>
  <th>Prog</th>
  <th>Total</th>
  <th>Grade</th>
  <th>Action</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<script src="admin.js"></script>

</body>
</html>
