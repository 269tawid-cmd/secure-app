<!doctype html>
<html>
<head>
  <title>Student Result System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="dark">

<!-- HEADER -->
<div class="header">
  <div class="wrap">
    <h2>📊 Student Result</h2>

    <div class="actions">
      <button class="btn ghost" onclick="toggleTheme()">Theme</button>
      <button class="btn danger" onclick="logout()">Logout</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="container">

  <!-- TOOLBAR -->
  <div class="toolbar card">
    <input id="search" placeholder="Search..." onkeyup="onSearchInput()">

    <select id="gradeFilter" onchange="applyAll()">
      <option value="">All</option>
      <option>A+</option>
      <option>A</option>
      <option>B</option>
      <option>F</option>
    </select>

    <select id="sortOrder" onchange="applyAll()">
      <option value="">Sort</option>
      <option value="asc">Total ↑</option>
      <option value="desc">Total ↓</option>
    </select>

    <button class="btn" onclick="downloadPDF()">PDF</button>
  </div>

  <!-- STATS -->
  <div id="stats" class="stats"></div>

  <!-- TABLE -->
  <div class="table-wrap card">
    <table>
      <thead id="thead"></thead>
      <tbody id="table"></tbody>
    </table>
  </div>

  <!-- CHART -->
  <canvas id="chart"></canvas>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="user.js"></script>

</body>
</html>
