<!DOCTYPE html>
<html>
<head>
  <title>Madrasatur Rashid Al Islamia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>User Dashboard</h2>
<button onclick="logout()">Logout</button>

<!-- 🔧 CONTROLS -->
<div style="margin:10px;">
  <input id="search" placeholder="Search name or ID..." onkeyup="onSearchInput()">
  
  <select id="gradeFilter" onchange="applyAll()">
    <option value="">All Grades</option>
    <option>A+</option>
    <option>A</option>
    <option>B</option>
    <option>F</option>
  </select>

  <select id="sortOrder" onchange="applyAll()">
    <option value="">Sort</option>
    <option value="asc">Total ↑</option>
    <option value="desc">Total ↓</option>
  </select>
</div>

<!-- 📊 STATS -->
<div id="stats" style="margin:10px;"></div>

<table>
<thead>
<tr>
  <th>ID</th>
  <th>Name</th>
  <th>Math</th>
  <th>Eng</th>
  <th>Sci</th>
  <th>Prog</th>
  <th>Total</th>
  <th>Grade</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<script src="user.js"></script>
</body>
</html>
