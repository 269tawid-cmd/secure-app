<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Records | Secure Access</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="user.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="user-page">

<header class="header">
  <div class="wrap">
    <div class="brand">
      <div style="background: var(--accent-color); padding: 8px; border-radius: 8px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h1>Student Dashboard</h1>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="logout()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </div>
</header>

<main class="container">
  <div class="card mb-12" style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
    <div class="input-group" style="flex: 2; min-width: 250px; margin-bottom: 0;">
      <label>Search Students</label>
      <input id="search" placeholder="Type name or ID..." onkeyup="onSearchInput()">
    </div>

    <div class="input-group" style="flex: 1; min-width: 120px; margin-bottom: 0;">
      <label>Grade Filter</label>
      <select id="gradeFilter" onchange="applyAll()">
        <option value="">All Grades</option>
        <option>A+</option>
        <option>A</option>
        <option>B</option>
        <option>F</option>
      </select>
    </div>

    <div class="input-group" style="flex: 1; min-width: 120px; margin-bottom: 0;">
      <label>Sort By</label>
      <select id="sortOrder" onchange="applyAll()">
        <option value="">Default</option>
        <option value="asc">Total: Low to High</option>
        <option value="desc">Total: High to Low</option>
      </select>
    </div>

    <button class="btn btn-ghost" style="height: 48px;" onclick="downloadPDF()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export PDF
    </button>
  </div>

  <div id="stats" class="stats mb-12" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;"></div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead id="thead">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Total Marks</th>
            <th>Average</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody id="table"></tbody>
      </table>
    </div>
  </div>

  <div class="card mt-12">
    <h3 style="margin-bottom: 1.5rem;">Performance Analytics</h3>
    <canvas id="chart"></canvas>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="user.js"></script>
</body>
</html>
