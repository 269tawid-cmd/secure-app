<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Secure Access</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="register.css">
</head>
<body class="auth-page">

<div style="position: absolute; top: 1rem; right: 1rem;">
  <div class="lang-switcher-wrapper">
    <select id="lang-switcher" class="lang-select">
      <option value="en">EN</option>
      <option value="bn">BN</option>
      <option value="ar">AR</option>
    </select>
  </div>
</div>

<div class="login-box card reveal">
  <div class="text-center mb-12">
    <h2 data-i18n="join_us">Join Us</h2>
    <p style="color: var(--text-secondary); font-size: 0.875rem;" data-i18n="create_account">Create your secure account</p>
  </div>

  <div class="input-group">
    <label for="username" data-i18n="username">Username</label>
    <input type="text" id="username" placeholder="Choose a username" data-i18n-placeholder="username" required>
  </div>

  <div class="input-group">
    <label for="password" data-i18n="password">Password</label>
    <input type="password" id="password" placeholder="Create a strong password" data-i18n-placeholder="password" required>
  </div>

  <div class="input-group">
    <label for="confirm-password" data-i18n="confirm_password">Confirm Password</label>
    <input type="password" id="confirm-password" placeholder="Repeat your password" data-i18n-placeholder="confirm_password" required>
  </div>

  <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;" onclick="register()" data-i18n="join_us">Create Account</button>

  <div class="text-center mt-12">
    <p style="font-size: 0.875rem; color: var(--text-secondary);">
      <span data-i18n="already_account">Already have an account?</span> <a href="login.html" style="color: var(--accent-color); text-decoration: none; font-weight: 500;" data-i18n="sign_in_here">Sign in here</a>
    </p>
  </div>
</div>

<script src="languages.js"></script>
<script src="i18n.js"></script>
<script src="register.js"></script>
</body>
</html>
